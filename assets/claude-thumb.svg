<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" fill="none">
  <defs>
    <linearGradient id="cl1" x1="0" y1="0" x2="400" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#cl1)"/>
  <!-- Chat interface mockup -->
  <rect x="24" y="24" width="220" height="170" rx="12" fill="#ffffff" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.25"/>
  <!-- Chat header -->
  <rect x="24" y="24" width="220" height="40" rx="12" fill="#2563EB" opacity="0.06"/>
  <circle cx="44" cy="44" r="12" fill="#2563EB" opacity="0.2"/>
  <text x="44" y="48" text-anchor="middle" fill="#2563EB" font-size="10" font-weight="700" font-family="system-ui">C</text>
  <text x="62" y="48" fill="#1e293b" font-size="11" font-weight="700" font-family="system-ui">Claude</text>
  <text x="230" y="48" text-anchor="end" fill="#64748b" font-size="7" font-family="system-ui">Opus 4</text>
  <!-- Chat messages -->
