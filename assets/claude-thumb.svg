  <text x="48" y="102" fill="#2563EB" font-size="7" font-weight="600" font-family="system-ui">How can I help?</text>
  <rect x="130" y="112" width="100" height="14" rx="7" fill="#f59e0b" opacity="0.12"/>
  <text x="140" y="122" fill="#d97706" font-size="7" font-weight="600" font-family="system-ui">Write an essay...</text>
  <rect x="38" y="132" width="140" height="14" rx="7" fill="#2563EB" opacity="0.1"/>
  <text x="48" y="142" fill="#2563EB" font-size="7" font-weight="600" font-family="system-ui">Sure, here's a draft...</text>
  <rect x="38" y="150" width="80" height="14" rx="7" fill="#2563EB" opacity="0.06"/>
  <!-- Right panel: Feature highlights -->
  <rect x="262" y="24" width="120" height="170" rx="12" fill="#ffffff" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.2"/>
  <text x="322" y="50" text-anchor="middle" fill="#1e293b" font-size="9" font-weight="700" font-family="system-ui">Key Features</text>
  <line x1="280" y1="58" x2="364" y2="58" stroke="#2563EB" stroke-width="0.5" opacity="0.15"/>
  <!-- Feature items with checkmarks -->
  <text x="276" y="74" fill="#10b981" font-size="8">✓</text>
  <text x="288" y="74" fill="#1e293b" font-size="8" font-family="system-ui">200K context</text>
  <text x="276" y="90" fill="#10b981" font-size="8">✓</text>
  <text x="288" y="90" fill="#1e293b" font-size="8" font-family="system-ui">Claude Code CLI</text>
  <text x="276" y="106" fill="#10b981" font-size="8">✓</text>
  <text x="288" y="106" fill="#1e293b" font-size="8" font-family="system-ui">Artifacts</text>
  <text x="276" y="122" fill="#10b981" font-size="8">✓</text>
  <text x="288" y="122" fill="#1e293b" font-size="8" font-family="system-ui">Projects</text>
  <text x="276" y="138" fill="#10b981" font-size="8">✓</text>
  <text x="288" y="138" fill="#1e293b" font-size="8" font-family="system-ui">Safety focus</text>
  <!-- Star rating -->
  <rect x="276" y="150" width="92" height="20" rx="6" fill="#f59e0b" opacity="0.08"/>
  <text x="285" y="165" fill="#d97706" font-size="9" font-weight="700" font-family="system-ui">★★★★☆</text>
  <text x="354" y="165" text-anchor="end" fill="#d97706" font-size="8" font-weight="700" font-family="system-ui">4.5</text>
  <!-- Category tag -->
  <rect x="280" y="196" width="108" height="16" rx="8" fill="#2563EB" opacity="0.1"/>
  <text x="334" y="208" text-anchor="middle" fill="#2563EB" font-size="8" font-weight="700" font-family="system-ui" letter-spacing="1">AI ASSISTANTS</text>
