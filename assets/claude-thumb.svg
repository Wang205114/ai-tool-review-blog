<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" fill="none">
  <defs>
    <linearGradient id="cl3" x1="0" y1="0" x2="400" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a0a0a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#cl3)"/>
  <!-- Warm amber glow -->
  <circle cx="200" cy="90" r="140" fill="#d97706" opacity="0.06"/>
  <!-- Top: REVIEW badge -->
  <rect x="145" y="12" width="110" height="22" rx="11" fill="#d97706" opacity="0.15"/>
  <text x="200" y="27" text-anchor="middle" fill="#f59e0b" font-size="9" font-weight="800" font-family="system-ui" letter-spacing="2">FULL REVIEW</text>
  <!-- Huge product name — dominant -->
  <text x="200" y="72" text-anchor="middle" fill="#f1f5f9" font-size="32" font-weight="900" font-family="system-ui" letter-spacing="-1">Claude AI</text>
  <!-- Star rating — centerpiece -->
  <text x="200" y="108" text-anchor="middle" fill="#f59e0b" font-size="18" font-family="system-ui">★★★★★</text>
  <text x="200" y="124" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="system-ui">★★★★★ by 2,400+ users</text>
  <!-- Feature badge row -->
  <rect x="40" y="140" width="100" height="24" rx="12" fill="#d97706" opacity="0.12"/>
  <text x="90" y="157" text-anchor="middle" fill="#f59e0b" font-size="9" font-weight="700" font-family="system-ui">Opus 4.7 ★</text>
  <rect x="150" y="140" width="100" height="24" rx="12" fill="#8b5cf6" opacity="0.12"/>
  <text x="200" y="157" text-anchor="middle" fill="#a78bfa" font-size="9" font-weight="700" font-family="system-ui">200K Context</text>
  <rect x="260" y="140" width="100" height="24" rx="12" fill="#10b981" opacity="0.12"/>
  <text x="310" y="157" text-anchor="middle" fill="#10b981" font-size="9" font-weight="700" font-family="system-ui">Code CLI</text>
  <!-- Bottom: Key specs line -->
  <text x="200" y="190" fill="#475569" font-size="10" font-family="system-ui">$20/mo · Coding · Writing · Analysis</text>
  <!-- Small chat bubble decoration -->
  <rect x="24" y="182" width="16" height="12" rx="6" fill="#d97706" opacity="0.1"/>
  <text x="32" y="191" text-anchor="middle" fill="#f59e0b" opacity="0.5" font-size="8" font-family="system-ui">C</text>
</svg>
