<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" fill="none">
  <defs>
    <linearGradient id="cd3" x1="0" y1="0" x2="400" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cd-title" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#cd3)"/>
  <!-- Hero background glow -->
  <circle cx="200" cy="80" r="130" fill="#3b82f6" opacity="0.06"/>
  <!-- Bracket decoration */
  <text x="20" y="46" fill="#3b82f6" opacity="0.1" font-size="80" font-weight="100" font-family="monospace">{</text>
  <text x="360" y="46" fill="#3b82f6" opacity="0.1" font-size="80" font-weight="100" font-family="monospace">}</text>
  <!-- Huge main title — the hero -->
  <text x="200" y="68" text-anchor="middle" fill="url(#cd-title)" font-size="28" font-weight="900" font-family="system-ui" letter-spacing="-1">Best AI Coding</text>
  <text x="200" y="102" text-anchor="middle" fill="url(#cd-title)" font-size="28" font-weight="900" font-family="system-ui" letter-spacing="-1">Assistants</text>
  <!-- Code fragment decoration -->
  <rect x="92" y="112" width="216" height="24" rx="6" fill="#1e293b" opacity="0.8"/>
  <text x="100" y="129" fill="#64748b" font-size="11" font-family="monospace">const</text>
  <text x="136" y="129" fill="#e2e8f1" font-size="11" font-family="monospace"> best = await</text>
  <text x="232" y="129" fill="#3b82f6" font-size="11" font-family="monospace">compare</text>
  <text x="280" y="129" fill="#e2e8f1" font-size="11" font-family="monospace">(</text>
  <text x="288" y="129" fill="#10b981" font-size="11" font-family="monospace">tools</text>
  <text x="316" y="129" fill="#e2e8f1" font-size="11" font-family="monospace">);</text>
  <!-- Bottom: Tool badges -->
  <rect x="40" y="150" width="96" height="26" rx="13" fill="#3b82f6" opacity="0.1"/>
  <circle cx="56" cy="163" r="6" fill="#3b82f6" opacity="0.3"/>
  <text x="68" y="168" fill="#60a5fa" font-size="10" font-weight="700" font-family="system-ui">Copilot</text>
  <rect x="152" y="150" width="80" height="26" rx="13" fill="#eab308" opacity="0.1"/>
  <circle cx="166" cy="163" r="6" fill="#eab308" opacity="0.3"/>
  <text x="178" y="168" fill="#facc15" font-size="10" font-weight="700" font-family="system-ui">Cursor</text>
  <rect x="248" y="150" width="96" height="26" rx="13" fill="#8b5cf6" opacity="0.1"/>
  <circle cx="264" cy="163" r="6" fill="#8b5cf6" opacity="0.3"/>
  <text x="276" y="168" fill="#a78bfa" font-size="10" font-weight="700" font-family="system-ui">Tabnine</text>
  <!-- Year label -->
  <text x="200" y="198" text-anchor="middle" fill="#475569" font-size="9" font-weight="700" font-family="system-ui" letter-spacing="3">HANDS-ON COMPARISON · 2026</text>
