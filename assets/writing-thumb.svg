<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" fill="none">
  <defs>
    <linearGradient id="wm1" x1="0" y1="0" x2="400" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0a1a"/>
      <stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="wg1" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Dark editorial background -->
  <rect width="400" height="220" fill="url(#wm1)"/>
  <!-- Subtle grid pattern -->
  <line x1="0" y1="55" x2="400" y2="55" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="0" y1="110" x2="400" y2="110" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="0" y1="165" x2="400" y2="165" stroke="#1e293b" stroke-width="0.5"/>
  <!-- Masthead / top bar -->
  <text x="200" y="30" text-anchor="middle" fill="#f59e0b" font-size="9" font-weight="800" font-family="system-ui" letter-spacing="4">AI TOOL GUIDE</text>
  <line x1="80" y1="38" x2="320" y2="38" stroke="#f59e0b" stroke-width="0.5" opacity="0.4"/>
  <!-- Big magazine headline -->
  <text x="24" y="78" fill="#f1f5f9" font-size="28" font-weight="900" font-family="system-ui" letter-spacing="-0.8">Best AI Writing</text>
  <text x="24" y="112" fill="#f1f5f9" font-size="28" font-weight="900" font-family="system-ui" letter-spacing="-0.8">Tools 2026</text>
  <!-- Gold accent underline -->
  <rect x="24" y="120" width="80" height="3" rx="1.5" fill="url(#wg1)"/>
  <!-- Pull quote / excerpt box -->
  <rect x="24" y="136" width="220" height="28" rx="4" fill="#f59e0b" opacity="0.08"/>
  <rect x="24" y="136" width="4" height="28" rx="2" fill="#f59e0b"/>
  <text x="36" y="148" fill="#fbbf24" font-size="8" font-family="system-ui">"Hands-on comparison of 10+ writing</text>
  <text x="36" y="159" fill="#fbbf24" font-size="8" font-family="system-ui">tools tested on real content workflows."</text>
  <!-- Bottom info bar -->
  <rect x="24" y="178" width="60" height="20" rx="10" fill="#f59e0b" opacity="0.12"/>
  <text x="54" y="192" text-anchor="middle" fill="#f59e0b" font-size="9" font-weight="700" font-family="system-ui">GUIDE</text>
  <rect x="94" y="178" width="70" height="20" rx="10" fill="#3b82f6" opacity="0.12"/>
  <text x="129" y="192" text-anchor="middle" fill="#60a5fa" font-size="9" font-weight="700" font-family="system-ui">12 min read</text>
  <!-- Right side decorative element -->
  <circle cx="340" cy="110" r="50" fill="#f59e0b" opacity="0.04"/>
  <text x="340" y="106" text-anchor="middle" fill="#f59e0b" opacity="0.08" font-size="60" font-weight="900" font-family="system-ui">"</text>
</svg>
