<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" fill="none">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="460" rx="20" fill="#f8fbff"/>
  <!-- Header bg -->
  <rect x="0" y="0" width="800" height="60" rx="20" fill="url(#headerGrad)"/>
  <rect x="0" y="30" width="800" height="30" fill="url(#headerGrad)"/>
  <text x="400" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#fff">ChatGPT vs Claude — Feature Comparison</text>

  <!-- Labels (left column) -->
  <text x="190" y="98" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Writing Quality</text>
  <text x="190" y="148" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Code Generation</text>
  <text x="190" y="198" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Research Support</text>
  <text x="190" y="248" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Long-Context</text>
  <text x="190" y="298" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Speed</text>
  <text x="190" y="348" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Affordability</text>

  <!-- ChatGPT bars (top row) -->
  <rect x="210" y="82" width="360" height="26" rx="6" fill="rgba(37,99,235,0.12)"/>
  <rect x="210" y="82" width="324" height="26" rx="6" fill="url(#bar1)"/>

  <rect x="210" y="132" width="360" height="26" rx="6" fill="rgba(37,99,235,0.12)"/>
  <rect x="210" y="132" width="306" height="26" rx="6" fill="url(#bar1)"/>

  <rect x="210" y="182" width="360" height="26" rx="6" fill="rgba(37,99,235,0.12)"/>
  <rect x="210" y="182" width="288" height="26" rx="6" fill="url(#bar1)"/>

  <rect x="210" y="232" width="360" height="26" rx="6" fill="rgba(37,99,235,0.12)"/>
  <rect x="210" y="232" width="252" height="26" rx="6" fill="url(#bar1)"/>

  <rect x="210" y="282" width="360" height="26" rx="6" fill="rgba(37,99,235,0.12)"/>
  <rect x="210" y="282" width="360" height="26" rx="6" fill="url(#bar1)"/>

  <rect x="210" y="332" width="360" height="26" rx="6" fill="rgba(37,99,235,0.12)"/>
  <rect x="210" y="332" width="288" height="26" rx="6" fill="url(#bar1)"/>

  <!-- ChatGPT scores -->
  <text x="580" y="100" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2563eb">9.0</text>
  <text x="580" y="150" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2563eb">8.5</text>
  <text x="580" y="200" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2563eb">8.0</text>
  <text x="580" y="250" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2563eb">7.0</text>
  <text x="580" y="300" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2563eb">10</text>
  <text x="580" y="350" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2563eb">8.0</text>

  <!-- Divider -->
  <line x1="210" y1="370" x2="620" y2="370" stroke="#dbe5f4" stroke-width="1" stroke-dasharray="4"/>

  <!-- Claude label -->
  <text x="100" y="395" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f97316">Claude</text>
  <rect x="210" y="382" width="360" height="26" rx="6" fill="rgba(249,115,22,0.12)"/>
  <rect x="210" y="382" width="324" height="26" rx="6" fill="url(#bar2)"/>
  <text x="580" y="400" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f97316">9.0</text>

  <rect x="210" y="416" width="360" height="26" rx="6" fill="rgba(249,115,22,0.12)"/>
  <rect x="210" y="416" width="288" height="26" rx="6" fill="url(#bar2)"/>
  <text x="580" y="434" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f97316">8.0</text>

  <!-- Legend: ChatGPT -->
  <rect x="210" y="88" width="16" height="14" rx="3" fill="#2563eb"/>
  <text x="230" y="100" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#52607a">ChatGPT</text>
  <rect x="210" y="138" width="16" height="14" rx="3" fill="#f97316"/>
  <text x="230" y="150" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#52607a">Claude</text>

  <!-- Badge -->
  <rect x="640" y="80" width="140" height="30" rx="15" fill="rgba(37,99,235,0.1)"/>
  <text x="710" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#2563eb">★ Best for speed</text>
  <rect x="640" y="375" width="140" height="30" rx="15" fill="rgba(249,115,22,0.1)"/>
  <text x="710" y="395" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f97316">★ Best for depth</text>
</svg>
