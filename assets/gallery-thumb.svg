<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" fill="none">
  <defs>
    <linearGradient id="gs2" x1="0" y1="0" x2="400" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f0a1a"/>
      <stop offset="1" stop-color="#1a0a2e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#gs2)"/>
  <!-- Accent glow -->
  <circle cx="200" cy="60" r="100" fill="#8b5cf6" opacity="0.08"/>
  <!-- Top label -->
  <rect x="120" y="12" width="160" height="22" rx="11" fill="#8b5cf6" opacity="0.12"/>
  <text x="200" y="27" text-anchor="middle" fill="#a78bfa" font-size="9" font-weight="800" font-family="system-ui" letter-spacing="2">2026 SHOWDOWN</text>
  <!-- Big main title — most prominent element -->
  <text x="200" y="62" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="900" font-family="system-ui" letter-spacing="-0.8">Best AI Image</text>
  <text x="200" y="88" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="900" font-family="system-ui" letter-spacing="-0.8">Generators</text>
  <!-- Gold underline accent -->
  <rect x="140" y="96" width="120" height="3" rx="1.5" fill="#f59e0b"/>
  <!-- Three-way comparison columns -->
  <!-- Column 1: Midjourney -->
  <rect x="24" y="112" width="108" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="78" cy="140" r="16" fill="#10b981" opacity="0.15"/>
  <text x="78" y="145" text-anchor="middle" fill="#10b981" font-size="14" font-weight="bold" font-family="system-ui">M</text>
  <text x="78" y="165" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="700" font-family="system-ui">Midjourney</text>
  <rect x="40" y="176" width="76" height="16" rx="8" fill="#10b981" opacity="0.12"/>
  <text x="78" y="187" text-anchor="middle" fill="#10b981" font-size="8" font-weight="700" font-family="system-ui">★★★★★</text>
  <!-- Column 2: DALL-E 3 -->
  <rect x="146" y="112" width="108" height="90" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
  <circle cx="200" cy="140" r="16" fill="#8b5cf6" opacity="0.15"/>
  <text x="200" y="145" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="bold" font-family="system-ui">D3</text>
  <text x="200" y="165" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="700" font-family="system-ui">DALL·E 3</text>
  <rect x="168" y="176" width="64" height="16" rx="8" fill="#8b5cf6" opacity="0.12"/>
  <text x="200" y="187" text-anchor="middle" fill="#a78bfa" font-size="8" font-weight="700" font-family="system-ui">★★★★☆</text>
  <!-- Column 3: Ideogram -->
  <rect x="268" y="112" width="108" height="90" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <circle cx="322" cy="140" r="16" fill="#f59e0b" opacity="0.15"/>
  <text x="322" y="145" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="bold" font-family="system-ui">I</text>
  <text x="322" y="165" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="700" font-family="system-ui">Ideogram</text>
  <rect x="290" y="176" width="64" height="16" rx="8" fill="#f59e0b" opacity="0.12"/>
  <text x="322" y="187" text-anchor="middle" fill="#f59e0b" font-size="8" font-weight="700" font-family="system-ui">★★★★☆</text>
</svg>
