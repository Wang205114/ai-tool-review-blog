  <text x="90" y="46" fill="#64748b" font-size="10" font-family="monospace">copilot-review.ts</text>
  <!-- Code lines -->
  <text x="36" y="74" fill="#64748b" font-size="11" font-family="monospace">1</text>
  <text x="52" y="74" fill="#cbd5e1" font-size="11" font-family="monospace">import { Copilot } from</text>
  <text x="36" y="92" fill="#64748b" font-size="11" font-family="monospace">2</text>
  <text x="52" y="92" fill="#cbd5e1" font-size="11" font-family="monospace">const ai = new Copilot();</text>
  <text x="36" y="110" fill="#64748b" font-size="11" font-family="monospace">3</text>
  <text x="52" y="110" fill="#cbd5e1" font-size="11" font-family="monospace">const result = await</text>
  <!-- Active suggestion line -->
  <rect x="36" y="118" width="140" height="22" rx="4" fill="#10b981" opacity="0.1"/>
  <rect x="36" y="118" width="3" height="22" rx="2" fill="#10b981"/>
  <text x="52" y="133" fill="#10b981" font-size="11" font-family="monospace">ai.suggestCode(prompt);</text>
  <text x="36" y="156" fill="#64748b" font-size="11" font-family="monospace">4</text>
  <text x="52" y="156" fill="#64748b" font-size="11" font-family="monospace">return result;</text>
  <text x="36" y="174" fill="#64748b" font-size="11" font-family="monospace">5</text>
  <!-- Checkmark -->
