  <rect x="204" y="44" width="130" height="26" rx="8" fill="#10b981" opacity="0.1"/>
  <text x="210" y="61" fill="#10b981" font-size="10" font-weight="800" font-family="system-ui" letter-spacing="1.5">REVIEW 2026</text>
  <text x="204" y="96" fill="#f1f5f9" font-size="24" font-weight="900" font-family="system-ui" letter-spacing="-0.5">GitHub</text>
  <text x="204" y="126" fill="#f1f5f9" font-size="24" font-weight="900" font-family="system-ui" letter-spacing="-0.5">Copilot</text>
  <text x="204" y="156" fill="#94a3b8" font-size="12" font-family="system-ui">Is it still worth $10/mo?</text>
