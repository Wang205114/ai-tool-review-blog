<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" fill="none">
  <defs>
    <linearGradient id="ig1" x1="0" y1="0" x2="400" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#faf5ff"/>
      <stop offset="1" stop-color="#ede9fe"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#ig1)"/>
  <!-- Overlapping polaroid/image cards -->
  <!-- Card 1: Mountain landscape -->
  <g transform="rotate(-8, 100, 100)">
    <rect x="24" y="36" width="110" height="140" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.2"/>
    <rect x="34" y="46" width="90" height="70" rx="4" fill="#7c3aed" opacity="0.06"/>
    <polygon points="50,100 70,70 90,85 100,65 114,90 114,116 34,116" fill="#7c3aed" opacity="0.12"/>
    <circle cx="90" cy="60" r="8" fill="#7c3aed" opacity="0.1"/>
    <rect x="34" y="126" width="90" height="4" rx="2" fill="#7c3aed" opacity="0.12"/>
    <rect x="34" y="134" width="60" height="3" rx="1.5" fill="#7c3aed" opacity="0.08"/>
  </g>
  <!-- Card 2: Abstract art -->
  <g transform="rotate(5, 220, 100)">
    <rect x="165" y="40" width="110" height="140" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.2"/>
    <rect x="175" y="50" width="90" height="70" rx="4" fill="#ec4899" opacity="0.06"/>
    <circle cx="210" cy="80" r="20" fill="#ec4899" opacity="0.1"/>
    <circle cx="230" cy="70" r="12" fill="#f59e0b" opacity="0.08"/>
    <rect x="210" y="95" width="40" height="15" rx="4" fill="#7c3aed" opacity="0.06"/>
    <rect x="175" y="130" width="90" height="4" rx="2" fill="#7c3aed" opacity="0.12"/>
    <rect x="175" y="138" width="50" height="3" rx="1.5" fill="#7c3aed" opacity="0.08"/>
  </g>
  <!-- Card 3: Portrait -->
  <g transform="rotate(-3, 300, 130)">
    <rect x="278" y="30" width="100" height="130" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.2"/>
    <rect x="288" y="40" width="80" height="60" rx="4" fill="#f59e0b" opacity="0.06"/>
    <circle cx="320" cy="56" r="8" fill="#7c3aed" opacity="0.08"/>
    <rect x="306" y="68" width="28" height="5" rx="2.5" fill="#7c3aed" opacity="0.06"/>
    <rect x="300" y="78" width="40" height="5" rx="2.5" fill="#7c3aed" opacity="0.06"/>
    <rect x="288" y="110" width="80" height="4" rx="2" fill="#7c3aed" opacity="0.12"/>
    <rect x="288" y="118" width="55" height="3" rx="1.5" fill="#7c3aed" opacity="0.08"/>
  </g>
  <!-- Free badge -->
  <circle cx="348" cy="32" r="20" fill="#10b981"/>
  <text x="348" y="33" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="800" font-family="system-ui">FREE</text>
  <text x="348" y="42" text-anchor="middle" fill="#ffffff" font-size="6" font-weight="600" font-family="system-ui">TIER</text>
  <!-- Category tag -->
  <rect x="280" y="196" width="108" height="16" rx="8" fill="#7c3aed" opacity="0.1"/>
  <text x="334" y="208" text-anchor="middle" fill="#7c3aed" font-size="8" font-weight="700" font-family="system-ui" letter-spacing="1">AI IMAGE</text>
</svg>