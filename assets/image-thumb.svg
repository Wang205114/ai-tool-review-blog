<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" fill="none">
  <defs>
    <linearGradient id="ib1" x1="0" y1="0" x2="400" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a0a1e"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#ib1)"/>
  <!-- Polaroid 1 - rotated left -->
  <g transform="rotate(-8, 80, 90)">
    <rect x="30" y="40" width="90" height="110" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="40" y="48" width="70" height="70" rx="2" fill="#0f172a"/>
    <circle cx="75" cy="83" r="18" fill="#ec4899" opacity="0.3"/>
    <circle cx="75" cy="83" r="7" fill="#f472b6"/>
    <rect x="50" y="100" width="18" height="8" rx="2" fill="#10b981" opacity="0.4"/>
    <text x="44" y="132" fill="#94a3b8" font-size="8" font-weight="600" font-family="system-ui">DALL-E 3</text>
  </g>
  <!-- Polaroid 2 - rotated right -->
  <g transform="rotate(12, 150, 100)">
    <rect x="100" y="55" width="90" height="110" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="110" y="63" width="70" height="70" rx="2" fill="#0f172a"/>
    <circle cx="145" cy="98" r="18" fill="#3b82f6" opacity="0.3"/>
    <rect x="125" y="115" width="28" height="10" rx="2" fill="#f59e0b" opacity="0.4"/>
    <text x="114" y="147" fill="#94a3b8" font-size="8" font-weight="600" font-family="system-ui">Midjourney</text>
  </g>
  <!-- Polaroid 3 - center, prominent -->
  <g transform="rotate(-3, 220, 85)">
    <rect x="175" y="30" width="100" height="120" rx="3" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="185" y="38" width="80" height="80" rx="2" fill="#0f172a"/>
    <circle cx="225" cy="78" r="22" fill="#8b5cf6" opacity="0.3"/>
    <circle cx="225" cy="78" r="9" fill="#a78bfa"/>
    <rect x="200" y="95" width="28" height="10" rx="2" fill="#8b5cf6" opacity="0.4"/>
    <text x="190" y="135" fill="#f1f5f9" font-size="9" font-weight="700" font-family="system-ui">Stable Diffusion</text>
  </g>
  <!-- Title at bottom overlay -->
  <rect x="0" y="178" width="400" height="42" fill="#0f172a" opacity="0.85"/>
  <text x="200" y="196" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="900" font-family="system-ui" letter-spacing="-0.3">Free AI Image Generators</text>
  <text x="200" y="210" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="system-ui">No credit card required · Compare free plans</text>
  <!-- FREE badge -->
  <rect x="310" y="182" width="60" height="22" rx="11" fill="#ec4899"/>
  <text x="340" y="197" text-anchor="middle" fill="#fff" font-size="10" font-weight="900" font-family="system-ui" letter-spacing="1">FREE</text>
</svg>
