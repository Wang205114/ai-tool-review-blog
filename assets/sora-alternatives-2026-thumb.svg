<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="400" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#bg)"/>
  <circle cx="80" cy="110" r="130" fill="#ef4444" opacity="0.04"/>
  <circle cx="320" cy="110" r="130" fill="#3b82f6" opacity="0.04"/>
  <!-- Left: SORA shutdown panel -->
  <rect x="16" y="32" width="165" height="150" rx="14" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" opacity="0.92"/>
  <text x="98" y="80" text-anchor="middle" fill="#ef4444" font-size="36" font-weight="900" font-family="system-ui" letter-spacing="3">SORA</text>
  <line x1="28" y1="88" x2="168" y2="88" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <rect x="42" y="98" width="112" height="22" rx="11" fill="#ef4444" opacity="0.2"/>
  <text x="98" y="114" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="800" font-family="system-ui" letter-spacing="1.5">SHUT DOWN</text>
  <text x="98" y="140" text-anchor="middle" fill="#475569" font-size="9" font-family="system-ui">April 26, 2026</text>
  <rect x="70" y="152" width="56" height="18" rx="9" fill="#ef4444" opacity="0.08"/>
  <text x="98" y="164" text-anchor="middle" fill="#ef4444" font-size="8" font-weight="700" font-family="system-ui">API ENDS SEP 24</text>
  <!-- Center arrow -->
  <rect x="181" y="98" width="24" height="24" rx="6" fill="#f59e0b" opacity="0.15"/>
  <text x="193" y="115" text-anchor="middle" fill="#f59e0b" font-size="16" font-weight="900" font-family="system-ui">→</text>
  <!-- Right: 5 Alternatives -->
  <rect x="209" y="32" width="175" height="150" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" opacity="0.92"/>
  <text x="296" y="55" text-anchor="middle" fill="#64748b" font-size="9" font-weight="700" font-family="system-ui" letter-spacing="1.5">TOP 5 ALTERNATIVES</text>
  <!-- Veo 3.1 -->
  <rect x="222" y="68" width="6" height="6" rx="3" fill="#3b82f6"/>
  <text x="235" y="74" fill="#e2e8f0" font-size="10" font-weight="700" font-family="system-ui">Veo 3.1</text>
  <text x="340" y="74" fill="#3b82f6" font-size="9" font-weight="700" font-family="system-ui">9.2</text>
  <!-- Kling 3.0 -->
  <rect x="222" y="88" width="6" height="6" rx="3" fill="#10b981"/>
  <text x="235" y="94" fill="#e2e8f0" font-size="10" font-weight="700" font-family="system-ui">Kling 3.0</text>
  <text x="340" y="94" fill="#10b981" font-size="9" font-weight="700" font-family="system-ui">8.8</text>
  <!-- Runway -->
  <rect x="222" y="108" width="6" height="6" rx="3" fill="#8b5cf6"/>
  <text x="235" y="114" fill="#e2e8f0" font-size="10" font-weight="700" font-family="system-ui">Runway Gen-4.5</text>
  <text x="340" y="114" fill="#8b5cf6" font-size="9" font-weight="700" font-family="system-ui">8.5</text>
  <!-- Seedance -->
  <rect x="222" y="128" width="6" height="6" rx="3" fill="#f59e0b"/>
  <text x="235" y="134" fill="#e2e8f0" font-size="10" font-weight="700" font-family="system-ui">Seedance 2.0</text>
  <text x="340" y="134" fill="#f59e0b" font-size="9" font-weight="700" font-family="system-ui">8.0</text>
  <!-- Pika -->
  <rect x="222" y="148" width="6" height="6" rx="3" fill="#ec4899"/>
  <text x="235" y="154" fill="#e2e8f0" font-size="10" font-weight="700" font-family="system-ui">Pika</text>
  <text x="340" y="154" fill="#ec4899" font-size="9" font-weight="700" font-family="system-ui">7.5</text>
  <!-- Bottom label -->
  <text x="200" y="203" text-anchor="middle" fill="#475569" font-size="9" font-weight="700" font-family="system-ui" letter-spacing="2">SORA ALTERNATIVES 2026</text>
