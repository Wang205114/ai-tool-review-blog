  <rect x="16" y="24" width="92" height="6" rx="3" fill="#EA4335"/>
  <rect x="184" y="24" width="92" height="6" rx="3" fill="#FBBC05"/>
  <rect x="276" y="24" width="108" height="6" rx="3" fill="#34A853"/>
