  <rect x="280" y="196" width="108" height="16" rx="8" fill="#64748b" opacity="0.1"/>
  <text x="334" y="208" text-anchor="middle" fill="#64748b" font-size="8" font-weight="700" font-family="system-ui" letter-spacing="1">AI PRODUCTIVITY</text>
