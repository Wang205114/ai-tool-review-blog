  <text x="203" y="78" text-anchor="middle" fill="#34A853" font-size="6" font-weight="600" font-family="system-ui">AI Agent</text>
  <text x="203" y="88" text-anchor="middle" fill="#34A853" font-size="5" font-weight="400" font-family="system-ui">24/7 personal</text>
  <rect x="156" y="100" width="94" height="14" rx="4" fill="#34A853" opacity="0.08"/>
