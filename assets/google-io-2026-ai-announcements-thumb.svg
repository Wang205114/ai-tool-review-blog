  <text x="292" y="57" fill="#d97706" font-size="8" font-weight="700" font-family="system-ui">Pics</text>
  <rect x="274" y="70" width="94" height="24" rx="4" fill="#ffffff" stroke="#FBBC05" stroke-width="0.5" stroke-opacity="0.3"/>
