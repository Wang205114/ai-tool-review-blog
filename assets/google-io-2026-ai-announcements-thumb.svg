  </defs>
  <rect width="400" height="220" fill="url(#go1)"/>
  <!-- Google I/O stage backdrop -->
  <rect x="16" y="24" width="368" height="128" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.25"/>
